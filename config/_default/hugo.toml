# -- Site Configuration --
# Docs: https://blowfish.page/docs/getting-started/

theme = "blowfish"

# TODO: replace with your final GitHub Pages URL, e.g. https://<username>.github.io/
baseURL = "https://yourusername.github.io/"

defaultContentLanguage = "en"
disableLanguages = []

enableRobotsTXT = true
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true

[pagination]
  pagerSize = 10

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 50
