# -- Theme Options --
# Docs: https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "olive"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

# Sections listed on the homepage / used for "recent posts" style listings.
mainSections = ["vocation", "reflections", "wanderings"]

disableImageOptimization = false
defaultBackgroundImage = "/img/background.svg"

highlightCurrentMenuArea = true
smartTOC = true

[header]
  layout = "fixed" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "hero" # valid options: page, profile, hero, card, background, custom
  showRecent = false

[article]
  showDate = true
  showViews = false
  showLikes = false
  showAuthor = true
  showHero = true
  heroStyle = "background" # valid options: basic, big, background, thumbAndBackground
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  sharingLinks = ["linkedin", "twitter", "reddit", "whatsapp", "email"]

[list]
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = true
  showCards = false
  orderByWeight = false
  groupByYear = true
  cardView = true

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  cardView = true

[term]
  showHero = false
  showBreadcrumbs = false
  groupByYear = false
  cardView = true

[verification]
  # google = ""
  # bing = ""
